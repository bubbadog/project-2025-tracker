# Deploys the site to GitHub Pages on every push to main (that is, on every
# merged pull request). Separate from check.yml so a failed check never deploys:
# this workflow rebuilds and revalidates before publishing.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0
      - name: Validate (with the private identifier list; see check.yml)
        env:
          TRACKER_FORBIDDEN_WORDS: ${{ secrets.TRACKER_FORBIDDEN_WORDS }}
        run: python3 scripts/validate.py --strict
      - run: python3 scripts/build_snapshot.py
      - name: Check the page script parses (a syntax error blanks the site)
        run: node -e "const s=require('fs').readFileSync('site/index.html','utf8');const m=s.match(/<script>([\\s\\S]*?)<\\/script>/);if(!m)throw new Error('no script block');new Function(m[1]);console.log('script parses')"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
